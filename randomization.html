<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - Starting</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <style>
        .randomization-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px;
        }
        
        .randomization-container h1 {
            margin-bottom: 30px;
            color: #ffffff;
        }
        
        .randomization-container p {
            font-size: 1.1em;
            color: #ffffff;
            margin-bottom: 40px;
            max-width: 600px;
        }
        
        .start-btn {
            padding: 15px 50px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 1px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="randomization-container">
        <h1>Sports Betting Simulation Study</h1>
        <p>Welcome! Click the button below to begin the survey.</p>
        <button class="start-btn" onclick="startSurvey()">Start Survey</button>
    </div>

    <script>
        function startSurvey() {
            // Randomly choose between control and treatment (50/50 chance)
            const isTreatment = Math.random() < 0.5;
            
            // Store the choice in sessionStorage for tracking
            sessionStorage.setItem('surveyGroup', isTreatment ? 'treatment' : 'control');
            
            // Redirect to the appropriate page
            // Using replace() so it doesn't add to browser history
            // The URL will change, but the user won't know which group until after clicking
            if (isTreatment) {
                window.location.replace('index-treatment.html');
            } else {
                window.location.replace('index.html');
            }
        }
    </script>
</body>
</html>
