<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - Starting</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <style>
        .randomization-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px;
        }
        
        .randomization-container h1 {
            margin-bottom: 30px;
            color: #ffffff;
        }
        
        .randomization-container p {
            font-size: 1.1em;
            color: #ffffff;
            margin-bottom: 40px;
            max-width: 600px;
        }
        
        .start-btn {
            padding: 15px 50px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 1px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="randomization-container">
        <h1>Sports Betting Simulation Study</h1>
        <p>Welcome! Click the button below to begin the survey.</p>
        <button class="start-btn" onclick="startSurvey()">Start Survey</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const groupCounts = { control: 0, treatment: 0 };
        let countsLoaded = false;

        document.addEventListener('DOMContentLoaded', function() {
            const assignedGroup = localStorage.getItem('surveyGroup');
            if (assignedGroup) {
                // User already has an assignment, redirect them to their assigned group
                if (assignedGroup === 'treatment') {
                    window.location.replace('index-treatment.html');
                } else {
                    window.location.replace('index-control.html');
                }
                return;
            }

            // Load current counts so we can balance assignments
            loadGroupCounts();
        });

        async function loadGroupCounts() {
            if (typeof initSupabase !== 'function') {
                console.warn('Supabase not configured, using 50/50 randomization.');
                return;
            }

            initSupabase();

            if (typeof supabaseClient === 'undefined' || !supabaseClient) {
                console.warn('Supabase client not available yet, retrying shortly.');
                setTimeout(loadGroupCounts, 300);
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('survey_responses')
                    .select('group');

                if (error) {
                    console.error('Error loading group counts:', error);
                    return;
                }

                groupCounts.control = 0;
                groupCounts.treatment = 0;
                data.forEach(entry => {
                    if (entry.group === 'control') {
                        groupCounts.control += 1;
                    } else if (entry.group === 'treatment') {
                        groupCounts.treatment += 1;
                    }
                });

                countsLoaded = true;
                console.log('Current group counts', groupCounts);
            } catch (err) {
                console.error('Exception loading group counts:', err);
            }
        }

        function calculateControlProbability() {
            if (!countsLoaded) {
                return 0.5; // fallback
            }

            const control = groupCounts.control;
            const treatment = groupCounts.treatment;
            const total = control + treatment;

            if (total === 0) {
                return 0.5;
            }

            // If treatment count is higher, favor control (and vice versa).
            // Clamp probability so we still keep randomness (20%-80% range).
            let probability = treatment / total;
            probability = Math.max(0.2, Math.min(0.8, probability));
            return probability;
        }

        function startSurvey() {
            // Check if user already has an assignment (shouldn't happen, but double-check)
            const existingGroup = localStorage.getItem('surveyGroup');
            if (existingGroup) {
                if (existingGroup === 'treatment') {
                    window.location.replace('index-treatment.html');
                } else {
                    window.location.replace('index-control.html');
                }
                return;
            }

            const controlProbability = calculateControlProbability();
            const randomValue = Math.random();
            const assignedGroup = randomValue < controlProbability ? 'control' : 'treatment';

            // Store the choice in localStorage (persists across sessions)
            // Also store in sessionStorage for backward compatibility
            localStorage.setItem('surveyGroup', assignedGroup);
            sessionStorage.setItem('surveyGroup', assignedGroup);
            
            // Redirect to the appropriate page
            if (assignedGroup === 'treatment') {
                window.location.replace('index-treatment.html');
            } else {
                window.location.replace('index-control.html');
            }
        }
    </script>
</body>
</html>
