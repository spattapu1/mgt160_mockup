<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey - Starting</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <style>
        .randomization-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px;
        }
        
        .randomization-container h1 {
            margin-bottom: 30px;
            color: #ffffff;
        }
        
        .randomization-container p {
            font-size: 1.1em;
            color: #ffffff;
            margin-bottom: 40px;
            max-width: 600px;
        }
        
        .start-btn {
            padding: 15px 50px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 1px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4);
        }
        
        .start-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="randomization-container">
        <h1>Sports Betting Simulation Study</h1>
        <p>Welcome! Click the button below to begin the survey.</p>
        <button class="start-btn" onclick="startSurvey()">Start Survey</button>
    </div>

    <script>
        // Check if user already has an assignment
        document.addEventListener('DOMContentLoaded', function() {
            const assignedGroup = localStorage.getItem('surveyGroup');
            if (assignedGroup) {
                // User already has an assignment, redirect them to their assigned group
                if (assignedGroup === 'treatment') {
                    window.location.replace('index-treatment.html');
                } else {
                    window.location.replace('index-control.html');
                }
            }
        });

        function startSurvey() {
            // Check if user already has an assignment (shouldn't happen, but double-check)
            const existingGroup = localStorage.getItem('surveyGroup');
            if (existingGroup) {
                // Already assigned, redirect to their group
                if (existingGroup === 'treatment') {
                    window.location.replace('index-treatment.html');
                } else {
                    window.location.replace('index-control.html');
                }
                return;
            }

            // Randomly choose between control and treatment (90% treatment, 10% control)
            // Math.random() returns [0, 1), so < 0.1 gives 10% probability for control
            const randomValue = Math.random();
            const isTreatment = randomValue >= 0.1; // 90% chance for treatment, 10% for control
            
            // Store the choice in localStorage (persists across sessions)
            // Also store in sessionStorage for backward compatibility
            localStorage.setItem('surveyGroup', isTreatment ? 'treatment' : 'control');
            sessionStorage.setItem('surveyGroup', isTreatment ? 'treatment' : 'control');
            
            // Redirect to the appropriate page
            // Using replace() so it doesn't add to browser history
            // The URL will change, but the user won't know which group until after clicking
            if (isTreatment) {
                window.location.replace('index-treatment.html');
            } else {
                window.location.replace('index-control.html');
            }
        }
    </script>
</body>
</html>
